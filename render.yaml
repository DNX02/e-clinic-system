services:
  - type: web
    name: e-clinic-control
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
