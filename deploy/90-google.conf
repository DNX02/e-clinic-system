# Google Compute Engine console logging override for E-Clinic.
#
# The stock rule `daemon,kern.* /dev/console` is intentionally disabled:
# AppArmor denies rsyslog access to /dev/console on this VM, causing repeated
# omfile retries and avoidable disk I/O pressure. Journald, /var/log/syslog,
# /var/log/kern.log and Google Ops Agent continue to retain system logs.
