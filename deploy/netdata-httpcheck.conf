update_every: 15

jobs:
  - name: eclinic_admin
    url: https://admin.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_doctor
    url: https://doctor.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_investor
    url: https://investor.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_monitor
    url: https://monitor.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_nurse
    url: https://nurse.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_survey
    url: https://survey.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_training
    url: https://training.e-clinic-control.ru/
    status_accepted: [200]
    timeout: 10
  - name: eclinic_database
    url: http://127.0.0.1:3000/api/health
    status_accepted: [200]
    response_match: '"database":.*"ok":true'
    timeout: 10
